name: Purge Bunny Cache

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Bunny Pull Zone cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
        run: |
          if [ -z "${BUNNY_API_KEY}" ] || [ -z "${BUNNY_PULLZONE_ID}" ]; then
            echo "Missing secrets: set BUNNY_API_KEY and BUNNY_PULLZONE_ID in GitHub repo settings."
            exit 1
          fi
          status="$(
            curl -sS -o /dev/null -w "%{http_code}" -X POST "https://api.bunny.net/pullzone/${BUNNY_PULLZONE_ID}/purgeCache" \
              -H "AccessKey: ${BUNNY_API_KEY}"
          )"
          if [ "${status}" != "200" ] && [ "${status}" != "204" ]; then
            echo "Purge failed (HTTP ${status})"
            exit 1
          fi
          echo "Purge ok (HTTP ${status})"
